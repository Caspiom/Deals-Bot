[project]
name = "deals-bot"
version = "0.1.0"
description = "Bot automatizado de achadinhos e promoções para Telegram"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.1",
    "apscheduler>=3.11.2",
    "async-lru>=2.3.0",
    "beautifulsoup4>=4.15.0",
    "discord-py>=2.3",
    "fake-useragent>=2.2.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "playwright>=1.60.0",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.8",
    "tenacity>=9.1.4",
    "tweepy>=4.16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]
