# Bot e API compartilham o mesmo SQLite: o bot escreve, a API lê. Rodam em
# containers separados porque têm perfis opostos — o bot é pesado e cíclico
# (Chromium), a API é leve e constante. Separar evita que um ciclo de scraping
# atrapalhe o atendimento das requisições.
services:
  deals-bot:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data   # persiste o SQLite entre restarts
      - ./logs:/app/logs   # logs acessíveis no host
    restart: unless-stopped
    # limita uso de memória — Playwright + Chromium precisam de pelo menos 1GB
    mem_limit: 1.5g
    memswap_limit: 1.5g

  api:
    build: .
    env_file: .env
    command: >
      uv run uvicorn src.api.app:app
      --host 0.0.0.0 --port 8000 --proxy-headers
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # Só local: quem fala com a internet é o Caddy, que faz o TLS. Publicar a
    # porta 8000 daria um caminho em HTTP puro contornando o certificado.
    ports:
      - "${API_BIND:-127.0.0.1}:8000:8000"
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 60s
      timeout: 5s
      retries: 3

  # HTTPS com Let's Encrypt automático. Só sobe com o perfil "https", para não
  # atrapalhar o desenvolvimento local (onde não há domínio para validar):
  #   docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"     # exigida pelo desafio do Let's Encrypt, mesmo usando só 443
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?defina API_DOMAIN no .env}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # guarda o certificado: sem isto, cada restart
      - caddy_config:/config  # pede um novo e esbarra no limite do Let's Encrypt
      - ./logs/caddy:/var/log/caddy
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
